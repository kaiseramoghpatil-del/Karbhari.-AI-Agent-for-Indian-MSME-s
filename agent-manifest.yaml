# aiKart Agent Manifest -- "Try Me Now" sandbox.
#
# Image pushed and verified: docker.io/yieldnever/karbhari:0.7.0
# (matches the 0.7.0 release documented in README.md).

apiVersion: aikart.dev/v1
kind: AgentManifest

metadata:
  name: karbhari-working-capital-guardian
  displayName: "KARBHARI - Working Capital Guardian"
  description: "Investigates why an MSME's working-capital / Drawing Power capacity is being depressed, and prepares an evidence pack."

runtime:
  type: docker
  image: "docker.io/yieldnever/karbhari:0.7.0"
  # Overrides the image's default CMD (which runs the full web app) so the
  # sandbox instead runs one-shot through the same service layer.
  command: ["python", "-m", "app.aikart.entrypoint"]

resources:
  cpu: 1
  memoryMb: 1024
  timeoutSeconds: 120

inputs:
  - name: mode
    label: "What would you like to run?"
    type: select
    required: false
    options: ["Run the bundled demo case (Suryoday Textiles, 6 documents)", "Describe my own problem"]
    default: "Run the bundled demo case (Suryoday Textiles, 6 documents)"
  - name: message
    label: "Describe your working-capital problem (optional for the demo case)"
    type: textarea
    required: false

output:
  format: markdown

security:
  networkEgress: allowlist
  egressAllowlist: ["generativelanguage.googleapis.com"]
