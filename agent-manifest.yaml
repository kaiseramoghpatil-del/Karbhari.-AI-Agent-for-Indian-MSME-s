# aiKart Agent Manifest -- "Try Me Now" sandbox (Method 1 submission).
#
# IMPORTANT: runtime.image below is a PLACEHOLDER. aiKart requires a
# publicly pullable image reference (Docker Hub, GHCR, etc). Before actual
# submission:
#   1. docker build -t <your-registry>/<your-org>/karbhari:0.1.0 .
#   2. docker push <your-registry>/<your-org>/karbhari:0.1.0
#   3. Replace the image value below with that pushed reference.
#
# Phase 0 only has the web-application flow to show (case creation + the
# honest "not yet implemented" investigation stub) -- there is nothing to
# demo-worthy here yet. This manifest exists so the aiKart execution
# contract is wired in from day one; it will keep working unchanged as
# later phases make the underlying investigation real.

apiVersion: aikart.dev/v1
kind: AgentManifest

metadata:
  name: karbhari-working-capital-guardian
  displayName: "KARBHARI - Working Capital Guardian"
  description: "Investigates why an MSME's working-capital / Drawing Power capacity is being depressed, and prepares an evidence pack."

runtime:
  type: docker
  image: "docker.io/REPLACE_ME/karbhari:0.1.0"
  # Overrides the image's default CMD (which runs the full web app) so the
  # sandbox instead runs one-shot through the same service layer.
  command: ["python", "-m", "app.aikart.entrypoint"]

resources:
  cpu: 1
  memoryMb: 1024
  timeoutSeconds: 120

inputs:
  - name: message
    label: "Describe your working-capital problem"
    type: textarea
    required: true

output:
  format: markdown

security:
  networkEgress: none
